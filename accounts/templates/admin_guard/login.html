{% load static %}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Acceso al admin · EMPRESARIO</title>
{% if site_key %}<script src="https://www.google.com/recaptcha/api.js" async defer></script>{% endif %}
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f7;
       font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0b1d1a}
  .caja{background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(11,29,26,.08);
        padding:32px;width:min(92vw,380px)}
  h1{margin:0 0 4px;font-size:20px}
  p.sub{margin:0 0 20px;font-size:13px;color:#5b6b68}
  label{display:block;font-size:12px;color:#5b6b68;margin:14px 0 4px}
  input{width:100%;box-sizing:border-box;border:1px solid #d8e0de;border-radius:10px;
        padding:10px 12px;font-size:15px}
  input:focus{outline:2px solid #0f766e;border-color:transparent}
  .g-recaptcha{margin-top:16px}
  button{margin-top:18px;width:100%;border:0;border-radius:999px;background:#0f766e;
         color:#fff;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#0d675f}
  .error{margin:0 0 12px;background:#fdecea;color:#b3261e;border-radius:10px;
         padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<main class="caja">
  <h1>Administración</h1>
  <p class="sub">Panel interno de EMPRESARIO. Doble verificación: contraseña y código a tu correo.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="paso" value="credenciales">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">Correo</label>
    <input id="id_username" name="username" type="email" autocomplete="username" autofocus required>
    <label for="id_password">Contraseña</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    {% if site_key %}<div class="g-recaptcha" data-sitekey="{{ site_key }}"></div>{% endif %}
    <button type="submit">Continuar</button>
  </form>
</main>
</body>
</html>
