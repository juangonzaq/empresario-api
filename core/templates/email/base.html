{% load static %}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f6f8f7;font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0b1d1a;">
<!-- preheader -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{{ subject }}{% endblock %}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f6f8f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
        <!-- marca -->
        <tr>
          <td style="padding:0 8px 16px 8px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td style="width:30px;height:30px;border-radius:9px;background:#045857;text-align:center;vertical-align:middle;">
                  <span style="display:inline-block;width:4px;height:8px;background:#cdface;border-radius:2px;margin-right:2px;"></span><span style="display:inline-block;width:4px;height:13px;background:#ffffff;border-radius:2px;margin-right:2px;"></span><span style="display:inline-block;width:4px;height:18px;background:#cdface;border-radius:2px;"></span>
                </td>
                <td style="padding-left:10px;font-size:18px;font-weight:700;letter-spacing:-0.2px;color:#0b1d1a;">Empresario</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- tarjeta -->
        <tr>
          <td style="background:#ffffff;border:1px solid #dde6e1;border-radius:24px;padding:32px 28px;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <!-- pie -->
        <tr>
          <td style="padding:20px 12px 0 12px;font-size:12px;line-height:18px;color:#7d8c88;">
            {% block footer %}
            Recibes este correo porque tienes una cuenta en Empresario.
            Si no fuiste tú, ignóralo: no pasa nada.
            {% endblock %}
            <br><br>
            <a href="{{ frontend_url }}" style="color:#045857;text-decoration:none;">{{ frontend_url }}</a> · Hecho en el Perú
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
